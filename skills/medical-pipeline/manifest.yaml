# Medical training pipeline, described for the domain-agnostic engine (../_pipeline-engine).
# Builds a model for general, EDUCATIONAL health information, not diagnosis or treatment.
# repo_root points at the medical-forge checkout; override with the env var in root_env.
# See ../_pipeline-engine/schema.md for the field reference.
name: medical-pipeline
root_env: MEDICAL_ROOT
repo_root: /Users/tristan/dev/medical-forge   # the repo holding the scripts (override with MEDICAL_ROOT)
venv_env: VENV_PYTHON
venv_python: ~/.venv/bin/python

env:
  WANDB_MODE: offline

imports: [mlx_lm]

hardware:
  helper_ram_gb: 16
  min_ram_gb: {"4B": 8, "8B": 16}
  min_free_gb:
    base: 10
    per_tier: {"4B": 3, "8B": 6}

stages:
  # No "offensive" stage. The chat template carries an educational, not-a-substitute-for-care
  # system prompt, and eval is capability + quality.

  - name: data
    tiers: [helper]
    requires: ["data_pipeline/collect_medical.py"]
    steps:
      # collect: authoritative public sources (MedlinePlus, textbooks, PubMed, MedQA), seed + best-effort fetch.
      - {label: collect,   run: "${py} data_pipeline/collect_medical.py --sources all --output-dir raw_data", produces: raw_data}
      # Offline-first defaults (no model); drop --no-enhancement and add --model <repo> to structure
      # for real local-LLM filtering and synthesis.
      - {label: filter,    run: "${py} data_pipeline/filter.py --input-dir raw_data --output-dir filtered_data --no-enhancement", produces: filtered_data}
      - {label: structure, run: "${py} data_pipeline/structure.py --input-dir filtered_data --output-dir structured_data", produces: structured_data}
      - gate:
          name: review
          prefer_if_populated: reviewed_data
          default: structured_data
          sets: source
          pause_message:
            - "Stages 1-3 done. --pause set, so assembly stops for the human review:"
            - "  1) stage the structured data where the reviewer reads it"
            - "  2) ${py} data_pipeline/review.py"
            - "  3) re-run this stage; it detects reviewed_data/ and assembles."
      - {label: assemble,  run: "${py} data_pipeline/assemble.py --input-dir ${source} --output-dir final_dataset --formats jsonl mlx --split-ratios 0.8 0.1 0.1", produces: final_dataset}
      - {label: templates, run: "${py} data_pipeline/to_chat_template.py --input-dir final_dataset --output-dir chat_templates --format qwen", produces: chat_templates}

  - name: train
    tiers: ["4B", "8B"]
    cwd: train
    requires: ["train/train_adapters.py", "chat_templates"]
    matrix:
      list_cmd: "${py} -c 'import config;print(chr(10).join(chr(9).join((m[\"key\"],m[\"repo\"])) for m in config.MODELS))'"
      fields: [key, repo]
      select_field: key
      run: "${py} train_adapters.py --key ${key} --data ../chat_templates"

  - name: eval
    tiers: ["4B", "8B"]
    cwd: eval
    requires: ["eval/run_all.py"]
    steps:
      # capability (MCQ) + quality (LLM judge). Flags after -- pass straight to run_all.py.
      - {label: matrix, run: "${py} run_all.py", passthrough: true}
