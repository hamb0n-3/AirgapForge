# AirgapForge cyber pipeline, described for the domain-agnostic engine (../_pipeline-engine).
# The engine and this manifest may live anywhere (they get migrated into ~/dev/sora/skills);
# repo_root points at the AirgapForge checkout, which stays put. Override it with the env var
# named in root_env. See ../_pipeline-engine/schema.md for the field reference.
name: airgapforge-cyber
root_env: AIRGAPFORGE_ROOT
repo_root: /Users/tristan/dev/CodeVault/ai/DataCreation/AirgapForge
venv_env: VENV_PYTHON
venv_python: ~/.venv/bin/python

env:
  WANDB_MODE: offline        # the training recipe enables W&B; offline stops it prompting

imports: [mlx_lm]            # interpreter must have this

hardware:
  helper_ram_gb: 16
  min_ram_gb: {"4B": 8, "20B": 16, "30B": 32, "120B": 128}
  min_free_gb:
    base: 10                 # models are local; this is training headroom + optional conversion copy
    per_tier: {"4B": 3, "20B": 8, "30B": 12, "120B": 30}

stages:
  - name: data
    tiers: [helper]
    requires: ["dataset_creation/1_data_collector.py"]
    wants: [".env"]
    steps:
      - {label: collect,   run: "${py} dataset_creation/1_data_collector.py --sources all --output-dir raw_data", produces: raw_data}
      - {label: filter,    run: "${py} dataset_creation/2_data_filter.py --input-dir raw_data --output-dir filtered_data", produces: filtered_data}
      - {label: structure, run: "${py} dataset_creation/3_data_structurer.py --input-dir filtered_data --output-dir structured_data", produces: structured_data}
      - gate:
          name: review
          prefer_if_populated: reviewed_data
          default: structured_data
          sets: source
          pause_message:
            - "Stages 1-3 done. --pause set, so assembly stops for the interactive human review:"
            - "  1) build domain_classified/ (reviewer expects JSON entries with a source_data field)"
            - "  2) ${py} dataset_creation/4_manual_reviewer.py"
            - "  3) re-run this stage; it detects reviewed_data/ and assembles."
      - {label: assemble,  run: "${py} dataset_creation/5_final_assembler.py --input-dir ${source} --output-dir final_dataset --formats jsonl mlx --split-ratios 0.8 0.1 0.1", produces: final_dataset}
      - {label: templates, run: "${py} dataset_creation/6_chat_template_converter.py --input-dir final_dataset --output-dir chat_templates --format qwen", produces: chat_templates}

  - name: offensive
    tiers: [helper]
    requires: ["offensive/generation"]
    steps:
      - {label: synth, run: "${py} offensive/generation/Code_Vuln-SFT-chat-mlx.py", produces: "offensive/data/train.jsonl"}
      - {label: split, run: "${py} offensive/generation/Code_Vuln-SFT-chat-mlx_valid_test_split.py"}

  - name: train
    tiers: ["4B", "20B", "30B", "120B"]
    cwd: eval
    requires: ["eval/train_adapters.py", "offensive/data/train.jsonl"]
    wants: ["eval/data/mlx_converted"]
    matrix:
      list_cmd: "${py} -c 'import config;print(chr(10).join(chr(9).join((m[\"key\"],m[\"alignment\"],m[\"repo\"])) for m in config.MODELS))'"
      fields: [key, alignment, repo]
      select_field: key
      skip_if_missing: {field: repo, contains: mlx_converted}
      run: "${py} train_adapters.py --key ${key}"
      append_when:
        - {field: alignment, equals: abliterated, args: "--lr 5e-5"}

  - name: eval
    tiers: ["4B", "20B", "30B", "120B"]
    cwd: eval
    requires: ["eval/config.py"]
    wants: ["eval/data/cybermetric"]
    steps:
      - {label: matrix, run: "${py} run_all.py", passthrough: true}
